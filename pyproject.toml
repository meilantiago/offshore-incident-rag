[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "offshore-incident-rag"
version = "0.0.1"
description = "Grounded question answering over public offshore safety reports (BSEE), with citations, refusals and statistically tested evaluation."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Tiago Meilan" }]
requires-python = ">=3.11"
# Runtime dependencies are added by each roadmap spec (ADR-0001), not up front.
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/offshore_rag"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "S110", "SIM", "RUF"]
# en dashes and arrows are intentional in messages; the formatter owns line length, long messages may exceed it
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.per-file-ignores]
# Hooks put scripts/ on sys.path through _hook_io before importing the harness modules.
".claude/hooks/*.py" = ["E402", "I001"]
"scripts/tests/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["offshore_rag"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
markers = [
  "integration: needs a running Postgres with pgvector",
  "llm: needs a real language model (local only, never in CI)",
]
